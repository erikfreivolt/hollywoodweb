<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="av-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d7b4"/><stop offset="1" stop-color="#c7a874"/></linearGradient>
    <radialGradient id="av-skin" cx=".42" cy=".38" r=".75"><stop offset="0" stop-color="#f8d8bf"/><stop offset=".6" stop-color="#eec0a0"/><stop offset="1" stop-color="#d79f80"/></radialGradient>
    <radialGradient id="av-ear" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#f1c4a5"/><stop offset="1" stop-color="#cf927a"/></radialGradient>
    <linearGradient id="av-neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98f72"/><stop offset="1" stop-color="#e5b394"/></linearGradient>
    <linearGradient id="av-hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4a35"/><stop offset=".55" stop-color="#4a3122"/><stop offset="1" stop-color="#32211a"/></linearGradient>
    <linearGradient id="av-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3122" stop-opacity=".75"/><stop offset="1" stop-color="#4a3122" stop-opacity="0"/></linearGradient>
    <radialGradient id="av-iris" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#b9d3cf"/><stop offset=".6" stop-color="#7ea49f"/><stop offset="1" stop-color="#4f726e"/></radialGradient>
    <linearGradient id="av-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2a29"/><stop offset="1" stop-color="#151413"/></linearGradient>
    <clipPath id="av-clip"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <g clip-path="url(#av-clip)">
    <rect width="120" height="120" fill="url(#av-bg)"/>
    <!-- body / turtleneck -->
    <path d="M14 128c2-20 18-30 34-33h24c16 3 32 13 34 33z" fill="url(#av-top)"/>
    <rect x="50" y="78" width="20" height="18" rx="6" fill="url(#av-neck)"/>
    <path d="M46 92c2-6 8-9 14-9s12 3 14 9c-3 4-8 6-14 6s-11-2-14-6z" fill="#1f1d1c"/>
    <path d="M47 92c3 3 8 4.5 13 4.5S70 95 73 92" fill="none" stroke="#3a3735" stroke-width="1"/>
    <!-- ears -->
    <ellipse cx="34" cy="58" rx="6.5" ry="9" fill="url(#av-ear)"/>
    <ellipse cx="86" cy="58" rx="6.5" ry="9" fill="url(#av-ear)"/>
    <path d="M33 54c2 1 3 4 2 7" fill="none" stroke="#c4866d" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M87 54c-2 1-3 4-2 7" fill="none" stroke="#c4866d" stroke-width="1.4" stroke-linecap="round"/>
    <!-- head -->
    <path d="M36.5 48c0-15 10-23 23.5-23s23.5 8 23.5 23v10c0 9-3 15-8 20-4 4-9 7-15.5 7s-11.5-3-15.5-7c-5-5-8-11-8-20z" fill="url(#av-skin)"/>
    <!-- skin fade on sides -->
    <path d="M36.5 36c-1.5 7-1.5 14 0 21l4.5-3c-1-6-1-12 1-17z" fill="url(#av-fade)"/>
    <path d="M83.5 36c1.5 7 1.5 14 0 21l-4.5-3c1-6 1-12-1-17z" fill="url(#av-fade)"/>
    <!-- hair: slicked-back pompadour, faded sides -->
    <path d="M37 40c-1-12 4-22 13-26 9-4 20-4 28 1 7 4 10 11 9 19l-3 6c-1-4-3-6-6-7-5-1-9-1-14-.5-6 .5-12 0-17 1-4 1-7 3-8 6z" fill="url(#av-hair)"/>
    <path d="M42 33c4-8 14-13 26-12M45 37c5-7 15-10 26-8M52 18c9-3 20-1 27 5M40 28c3-6 9-11 17-13" fill="none" stroke="#8a634a" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    <path d="M60 17c8-1 16 2 21 7" fill="none" stroke="#a37a5f" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
    <!-- brows -->
    <path d="M41.5 46.5c3-2.4 8-2.8 12.5-1.4" fill="none" stroke="#3f2a1e" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M66 45.1c4.5-1.4 9.5-1 12.5 1.4" fill="none" stroke="#3f2a1e" stroke-width="3.2" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="48" cy="54" rx="6" ry="5" fill="#fff"/>
    <ellipse cx="72" cy="54" rx="6" ry="5" fill="#fff"/>
    <circle cx="48.4" cy="54.4" r="3.7" fill="url(#av-iris)"/>
    <circle cx="72.4" cy="54.4" r="3.7" fill="url(#av-iris)"/>
    <circle cx="48.4" cy="54.4" r="1.7" fill="#1d2523"/>
    <circle cx="72.4" cy="54.4" r="1.7" fill="#1d2523"/>
    <circle cx="47.2" cy="53" r="1.1" fill="#fff"/>
    <circle cx="71.2" cy="53" r="1.1" fill="#fff"/>
    <path d="M42 52.6c3-3.2 9-3.4 12 0M66 52.6c3-3.4 9-3.2 12 0" fill="none" stroke="#5a3f30" stroke-width="1.3" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M60 56v8" stroke="#d9a084" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <path d="M56 66c2 1.6 6 1.6 8 0" fill="none" stroke="#c98a6e" stroke-width="1.6" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="44" cy="64" rx="5" ry="3" fill="#ef9f8a" opacity=".28"/>
    <ellipse cx="76" cy="64" rx="5" ry="3" fill="#ef9f8a" opacity=".28"/>
    <!-- mouth: slight confident smile -->
    <path d="M53.5 73c3 1.6 9.5 1.8 13.5-.4" fill="none" stroke="#b56d5e" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M55.5 75.3c3 1 7.5 1 10.5 0" fill="none" stroke="#e7a08e" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
    <!-- jaw shadow -->
    <path d="M38 64c2 8 6 14 11 17 3 2 7 3 11 3s8-1 11-3c5-3 9-9 11-17-1 10-5 16-10 20-3 2-7 3.5-12 3.5s-9-1.5-12-3.5c-5-4-9-10-10-20z" fill="#c98a6e" opacity=".18"/>
  </g>
</svg>
